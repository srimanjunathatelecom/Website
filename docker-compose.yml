# Production-shaped stack: the app container plus Postgres.
#
#   cp .env.example .env   # fill in real values first
#   docker compose up -d --build
#
# The app reads everything from .env (never committed). DATABASE_URL should
# point at the db service below, e.g.
#   DATABASE_URL=postgresql://postgres:<password>@db:5432/sms_stores
#
# POSTGRES_PASSWORD is read from .env too, so the database password lives in
# exactly one file.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sms_stores
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sms_stores"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
